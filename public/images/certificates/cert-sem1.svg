  <text x="400" y="340" fill="#a7f3d0" font-family="'Space Grotesk', Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">GRADE POINT AVERAGE: 9.43 / 10.0</text>
  
  <g transform="translate(100, 410)">
