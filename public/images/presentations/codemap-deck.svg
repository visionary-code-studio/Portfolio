<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#codeGrad)"/>
  <circle cx="200" cy="200" r="220" fill="#38bdf8" opacity="0.05" filter="blur(80px)"/>
  
  <rect x="40" y="40" width="720" height="370" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.5"/>
  
  <rect x="70" y="70" width="125" height="28" rx="6" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
  <text x="132" y="89" fill="#818cf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">HACKATHON</text>
  
  <text x="70" y="160" fill="#ffffff" font-family="'Space Grotesk', Inter, sans-serif" font-size="34" font-weight="800">CODEMAP: AI VISUALIZER</text>
  <text x="70" y="200" fill="#94a3b8" font-family="Inter, sans-serif" font-size="18">Deconstructing AST Parsing &amp; Real-Time Architecture Graphs</text>
  
  <!-- Network Graph Abstract -->
  <g transform="translate(500, 160)">
    <line x1="60" y1="40" x2="160" y2="90" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
    <line x1="60" y1="40" x2="90" y2="150" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
    <line x1="160" y1="90" x2="200" y2="160" stroke="rgba(129, 140, 248, 0.4)" stroke-width="2"/>
    <line x1="90" y1="150" x2="200" y2="160" stroke="rgba(129, 140, 248, 0.4)" stroke-width="2"/>
    
    <circle cx="60" cy="40" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="60" y="45" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">AST</text>
    
    <circle cx="160" cy="90" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2.5"/>
    <text x="160" y="95" fill="#818cf8" font-family="monospace" font-size="10" text-anchor="middle">LLM</text>
    
    <circle cx="90" cy="150" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="200" cy="160" r="26" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3"/>
    <text x="200" y="165" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">MAP</text>
  </g>
  
  <line x1="70" y1="350" x2="730" y2="350" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="70" y="375" fill="#64748b" font-family="monospace" font-size="12">TECH ARCHITECTURE • 2026</text>
  <text x="730" y="375" fill="#818cf8" font-family="monospace" font-size="12" text-anchor="end">VAIBHAV SHAW</text>
</svg>
