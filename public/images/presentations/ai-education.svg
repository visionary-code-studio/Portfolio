<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <circle cx="650" cy="120" r="180" fill="#00f2fe" opacity="0.08" filter="blur(60px)"/>
  <circle cx="150" cy="350" r="140" fill="#4facfe" opacity="0.06" filter="blur(50px)"/>
  
  <!-- Presentation Card Frame -->
  <rect x="40" y="40" width="720" height="370" rx="16" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>
  
  <!-- Badge -->
  <rect x="70" y="70" width="110" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
  <text x="125" y="89" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">AI / ML</text>
  
  <!-- Title -->
  <text x="70" y="160" fill="#ffffff" font-family="'Space Grotesk', Inter, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">AI IN EDUCATION</text>
  <text x="70" y="200" fill="#94a3b8" font-family="Inter, sans-serif" font-size="18" font-weight="400">Transforming Personalized Learning &amp; Intelligent Tutoring</text>
  
  <!-- Decorative Abstract Graphics -->
  <g transform="translate(520, 180)">
    <circle cx="90" cy="90" r="80" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="90" cy="90" r="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="90" cy="90" r="12" fill="#00f2fe"/>
    <line x1="90" y1="10" x2="90" y2="170" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <line x1="10" y1="90" x2="170" y2="90" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  </g>
  
  <!-- Footer Info -->
  <line x1="70" y1="350" x2="730" y2="350" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="70" y="375" fill="#64748b" font-family="monospace" font-size="12">RESEARCH COLLOQUIUM • 2026</text>
  <text x="730" y="375" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="end">VAIBHAV SHAW</text>
</svg>
